name: Lab 05 - AI Vision Service (A4) - Compose Readiness Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ai-vision-check:
    name: Validate AI Vision Service - A4
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman + HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Create .env from example
        run: cp .env.example .env

      - name: Lint docker-compose.yml
        run: docker compose config --quiet

      - name: Build and start Compose stack
        run: docker compose up -d --build --wait

      - name: Show running containers
        run: docker compose ps

      - name: Test AI Vision /health (port 8000)
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS http://localhost:8000/health && exit 0
            echo "Retry $i..."; sleep 5
          done
          docker compose logs ai-vision
          exit 1

      - name: Test /vision/objects endpoint
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS http://localhost:8000/vision/objects && exit 0
            echo "Retry $i..."; sleep 5
          done
          exit 1

      - name: Run Newman collection
        run: |
          mkdir -p reports
          newman run postman/collections/ai-vision.postman_collection.json \
            -e postman/environments/ai-vision-local.postman_environment.json \
            -r cli,junit,htmlextra \
            --reporter-junit-export reports/ai-vision-test.xml \
            --reporter-htmlextra-export reports/ai-vision-test.html

      - name: Verify OpenAPI contract exists
        run: |
          if [ ! -f "contracts/ai-vision.openapi.yaml" ]; then
            echo "::error::Missing OpenAPI contract"
            exit 1
          fi

      - name: Verify service boundary documentation
        run: |
          if [ ! -f "service_boundary.md" ]; then
            echo "::error::Missing service boundary documentation"
            exit 1
          fi

      - name: Verify readiness checklist
        run: |
          CHECKLIST="checklists/readiness-checklist.md"
          if [ ! -f "$CHECKLIST" ]; then
            echo "::error::Missing file $CHECKLIST"
            exit 1
          fi

          TOTAL=$(grep -cE '^[[:space:]]*-[[:space:]]*\[[ xX]\]' "$CHECKLIST" || true)
          CHECKED=$(grep -cE '^[[:space:]]*-[[:space:]]*\[[xX]\]' "$CHECKLIST" || true)

          echo "Readiness checklist: ${CHECKED:-0}/${TOTAL:-0} items checked"

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-vision-reports-a4
          path: reports/
          if-no-files-found: warn

      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down Compose stack
        if: always()
        run: docker compose down -v
