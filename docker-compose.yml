services:
  # AI Vision Service - Product A
  ai-vision:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-vision-a4
    env_file:
      - .env
    networks:
      - product-a-internal
      - class-net
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  product-a-internal:
    driver: bridge
  class-net:
    external: true

volumes:
  ai-vision-models:
    driver: local
